<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7E5F"/>
      <stop offset="50%" stop-color="#FEB47B"/>
      <stop offset="100%" stop-color="#FFECCC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="350" fill="url(#sunsetGrad)"/>
  
  <!-- Glowing sun -->
  <circle cx="200" cy="180" r="60" fill="#FFF9E6" opacity="0.9"/>
  
  <!-- Silhouette hills / shoreline -->
  <path d="M 0 250 Q 100 230 200 245 T 400 235 L 400 350 L 0 350 Z" fill="#6B4D68" opacity="0.8"/>
  <path d="M 0 270 Q 150 250 250 265 T 400 255 L 400 350 L 0 350 Z" fill="#48324A"/>

  <!-- Silhouette couple holding hands -->
  <g transform="translate(165, 200)" fill="#FFF9E6">
    <!-- Person 1 -->
    <circle cx="20" cy="15" r="9"/>
    <path d="M 12 30 C 12 25 28 25 28 30 L 28 55 L 12 55 Z"/>
    
    <!-- Person 2 -->
    <circle cx="45" cy="17" r="8"/>
    <path d="M 38 31 C 38 26 52 26 52 31 L 52 55 L 38 55 Z"/>
    
    <!-- Holding hands -->
    <path d="M 24 38 Q 32 44 40 38" stroke="#FFF9E6" stroke-width="3" fill="none"/>
  </g>

  <!-- Flying birds -->
  <path d="M 80 80 Q 90 70 100 80 Q 110 70 120 80" stroke="#FFF" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 280 90 Q 288 82 296 90 Q 304 82 312 90" stroke="#FFF" stroke-width="2" fill="none" opacity="0.8"/>

  <text x="200" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#FFF" text-anchor="middle">"Golden hour with my favorite view 🌅"</text>
</svg>
