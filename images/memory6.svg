<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <linearGradient id="cozyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FFE4E1" />
      <stop offset="100%" stop-color="#F8E1EE" />
    </linearGradient>
  </defs>

  <rect width="400" height="350" fill="url(#cozyGrad)"/>

  <!-- Cozy Picnic Blanket / Pillow -->
  <rect x="80" y="160" width="240" height="130" rx="16" fill="#FFF" stroke="#FFB6C1" stroke-width="2"/>
  <path d="M 80 190 L 320 190 M 80 220 L 320 220 M 80 250 L 320 250" stroke="#FFE4E1" stroke-width="2"/>
  <path d="M 140 160 L 140 290 M 200 160 L 200 290 M 260 160 L 260 290" stroke="#FFE4E1" stroke-width="2"/>

  <!-- Delicious Cake & Sweets on Plate -->
  <ellipse cx="200" cy="225" rx="55" ry="20" fill="#FAD2E1"/>
  <!-- Slice of Strawberry Cake -->
  <path d="M 180 220 L 220 220 L 200 170 Z" fill="#FF85A2"/>
  <rect x="180" y="210" width="40" height="8" rx="2" fill="#FFF"/>
  <circle cx="200" cy="165" r="7" fill="#FF1744"/>

  <!-- Sparkles, Hearts and Flowers around -->
  <text x="110" y="220" font-size="28">🍓</text>
  <text x="270" y="220" font-size="28">🌸</text>
  <text x="130" y="120" font-size="34">💖</text>
  <text x="250" y="110" font-size="30">✨</text>
  <text x="190" y="80" font-size="36">🧸</text>

  <text x="200" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#8B4367" text-anchor="middle">"Every cozy, sweet moment spent with you 🍰💖"</text>
</svg>
