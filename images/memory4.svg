<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <linearGradient id="nightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1C38"/>
      <stop offset="60%" stop-color="#3A2A56"/>
      <stop offset="100%" stop-color="#5E3B66"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="60%" stop-color="#FFEFA6"/>
      <stop offset="100%" stop-color="#FFEFA6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="350" fill="url(#nightGrad)"/>
  
  <!-- Glowing Moon -->
  <circle cx="200" cy="110" r="50" fill="url(#moonGlow)"/>
  <circle cx="190" cy="110" r="38" fill="#FFFCE6"/>
  <!-- Stars -->
  <circle cx="60" cy="60" r="2.5" fill="#FFF"/>
  <circle cx="110" cy="90" r="1.5" fill="#FFF"/>
  <circle cx="90" cy="140" r="2" fill="#FFF"/>
  <circle cx="310" cy="70" r="2.5" fill="#FFF"/>
  <circle cx="340" cy="130" r="2" fill="#FFF"/>
  <circle cx="280" cy="120" r="1.5" fill="#FFF"/>
  <circle cx="150" cy="50" r="2" fill="#FFF"/>
  <circle cx="250" cy="40" r="2" fill="#FFF"/>

  <!-- Shooting star -->
  <line x1="280" y1="50" x2="330" y2="75" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Fairy lights garland -->
  <path d="M 0 190 Q 100 230 200 195 T 400 200" stroke="#FFE4B5" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="50" cy="208" r="4" fill="#FFD700"/>
  <circle cx="100" cy="216" r="4" fill="#FF69B4"/>
  <circle cx="150" cy="211" r="4" fill="#7FFFD4"/>
  <circle cx="200" cy="196" r="4" fill="#FFD700"/>
  <circle cx="250" cy="204" r="4" fill="#FF69B4"/>
  <circle cx="300" cy="203" r="4" fill="#7FFFD4"/>
  <circle cx="350" cy="198" r="4" fill="#FFD700"/>

  <text x="200" y="270" font-size="28" text-anchor="middle">✨ 🌸 💖 🌸 ✨</text>
  <text x="200" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#F8E1EE" text-anchor="middle">"Under the stars with my whole world ✨"</text>
</svg>
