<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <linearGradient id="mem3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D7FF"/>
      <stop offset="100%" stop-color="#FFD6E8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="350" fill="url(#mem3Grad)"/>
  
  <!-- Cute Teddy Bear with Love Heart -->
  <g transform="translate(140, 70)">
    <!-- Ears -->
    <circle cx="35" cy="40" r="22" fill="#C49A6C"/>
    <circle cx="35" cy="40" r="14" fill="#E8C39E"/>
    <circle cx="85" cy="40" r="22" fill="#C49A6C"/>
    <circle cx="85" cy="40" r="14" fill="#E8C39E"/>
    
    <!-- Head -->
    <circle cx="60" cy="70" r="45" fill="#D4A778"/>
    
    <!-- Snout -->
    <ellipse cx="60" cy="85" rx="18" ry="14" fill="#FFF3E0"/>
    <ellipse cx="60" cy="78" rx="8" ry="6" fill="#5D4037"/>
    <path d="M 60 84 L 60 92 M 54 90 Q 60 95 66 90" stroke="#5D4037" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Eyes -->
    <circle cx="45" cy="68" r="5" fill="#2E1C14"/>
    <circle cx="43" cy="66" r="1.5" fill="#FFF"/>
    <circle cx="75" cy="68" r="5" fill="#2E1C14"/>
    <circle cx="73" cy="66" r="1.5" fill="#FFF"/>
    
    <!-- Blush -->
    <circle cx="35" cy="80" r="6" fill="#FF8A9A" opacity="0.6"/>
    <circle cx="85" cy="80" r="6" fill="#FF8A9A" opacity="0.6"/>

    <!-- Body -->
    <ellipse cx="60" cy="150" rx="42" ry="48" fill="#C49A6C"/>

    <!-- Holding Heart -->
    <path d="M 60 170 C 45 145 25 155 25 130 C 25 110 50 110 60 125 C 70 110 95 110 95 130 C 95 155 75 145 60 170 Z" fill="#FF477E"/>
    <text x="60" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFF" text-anchor="middle">VENU</text>
  </g>

  <!-- Sparkles & Stars around -->
  <text x="50" y="90" font-size="30">✨</text>
  <text x="310" y="100" font-size="30">🌸</text>
  <text x="60" y="240" font-size="28">🎈</text>
  <text x="320" y="230" font-size="30">🧸</text>

  <text x="200" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#6A4C7D" text-anchor="middle">"Just being goofy & cuties together 🧸"</text>
</svg>
