<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD1DC" />
      <stop offset="50%" stop-color="#FFB6C1" />
      <stop offset="100%" stop-color="#E6E6FA" />
    </linearGradient>
    <radialGradient id="sparkleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF" />
      <stop offset="100%" stop-color="#FF69B4" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF69B4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="30" fill="url(#bgGrad)"/>

  <!-- Aesthetic Stars & Floating Hearts -->
  <circle cx="80" cy="80" r="15" fill="#FFF" opacity="0.8"/>
  <circle cx="320" cy="90" r="10" fill="#FFF" opacity="0.8"/>
  <circle cx="70" cy="300" r="12" fill="#FFF" opacity="0.7"/>
  <circle cx="330" cy="310" r="18" fill="#FFF" opacity="0.7"/>

  <!-- Sparkles -->
  <path d="M 120 140 Q 130 140 130 130 Q 130 140 140 140 Q 130 140 130 150 Q 130 140 120 140 Z" fill="#FFF" opacity="0.9"/>
  <path d="M 280 180 Q 290 180 290 170 Q 290 180 300 180 Q 290 180 290 190 Q 290 180 280 180 Z" fill="#FFF" opacity="0.9"/>

  <!-- Avatar Base (Silhouette / Aesthetic Portrait) -->
  <g filter="url(#shadow)">
    <!-- Hair back -->
    <path d="M 140 160 C 130 100 270 100 260 160 C 270 210 275 250 250 260 C 240 230 230 230 200 230 C 170 230 160 230 150 260 C 125 250 130 210 140 160 Z" fill="#4A3B4E"/>
    
    <!-- Shoulders -->
    <path d="M 130 330 C 145 280 255 280 270 330 C 275 350 125 350 130 330 Z" fill="#FF8DA1"/>
    <!-- Cute neck -->
    <rect x="185" y="220" width="30" height="50" rx="10" fill="#FDDCB8"/>
    <!-- Face -->
    <ellipse cx="200" cy="180" rx="42" ry="50" fill="#FFE5D9"/>
    
    <!-- Blush -->
    <ellipse cx="178" cy="190" rx="9" ry="5" fill="#FF8DA1" opacity="0.6"/>
    <ellipse cx="222" cy="190" rx="9" ry="5" fill="#FF8DA1" opacity="0.6"/>
    
    <!-- Eyes (Cute Happy Smile Curves) -->
    <path d="M 172 178 Q 180 170 188 178" stroke="#4A3B4E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 212 178 Q 220 170 228 178" stroke="#4A3B4E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
    <!-- Cute Smile -->
    <path d="M 193 198 Q 200 206 207 198" stroke="#FF5376" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Bangs / Front Hair -->
    <path d="M 155 160 C 170 140 230 140 245 160 C 235 150 215 155 200 155 C 185 155 165 150 155 160 Z" fill="#4A3B4E"/>
    
    <!-- Cute Hair Bow / Tiara -->
    <path d="M 190 122 Q 200 110 210 122 Q 200 134 190 122 Z" fill="#FF69B4"/>
    <circle cx="184" cy="122" r="8" fill="#FF8DA1"/>
    <circle cx="216" cy="122" r="8" fill="#FF8DA1"/>
    <circle cx="200" cy="122" r="5" fill="#FFD700"/>
  </g>

  <!-- Crown / Flower -->
  <g transform="translate(182, 90) scale(0.9)">
    <polygon points="20,0 28,18 45,5 38,28 2,28 -5,5 12,18" fill="#FFD700" stroke="#E6A800" stroke-width="1.5"/>
    <circle cx="20" cy="12" r="3.5" fill="#FF69B4"/>
  </g>

  <!-- Floating Heart Badge -->
  <g transform="translate(240, 240)">
    <circle cx="20" cy="20" r="22" fill="#FFF" filter="url(#shadow)"/>
    <path d="M 20 28 C 14 20 10 16 10 12 C 10 7 14 5 17 5 C 19 5 20 7 20 7 C 20 7 21 5 23 5 C 26 5 30 7 30 12 C 30 16 26 20 20 28 Z" fill="#FF477E"/>
  </g>
</svg>
